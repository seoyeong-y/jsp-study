<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회원 가입</title>
<link rel="stylesheet" href="resources/style.css">
</head>
<body>

	<div class="container">
		<h2>회원 가입</h2>

		<form action="http://localhost:8080/ysy_free/MemberServlet?cmd=join"
			method="post">
			<label for="id">아이디</label> <input type="text" id="id" name="id"
				required placeholder="아이디를 입력하세요"> <label for="passwd">비밀번호</label>
			<input type="password" id="passwd" name="passwd" required
				placeholder="비밀번호를 입력하세요"> <label for="userame">이름</label> <input
				type="text" id="username" name="username" required
				placeholder="이름을 입력하세요"> <label for="age">나이</label> <input
				type="number" id="age" name="age" required placeholder="나이를 입력하세요">

			<label for="sex">성별</label> <select id="sex" name="sex" required>
				<option value="남성">남성</option>
				<option value="여성">여성</option>
			</select> <label for="phone">전화번호</label> <input type="tel" id="phone"
				name="phone" required placeholder="전화번호를 입력하세요 (예: 010-1234-5678)">

			<input type="submit" value="회원 가입">
		</form>
	</div>

</body>
</html>
