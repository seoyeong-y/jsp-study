<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Web Service Programming Homework</title>
<link rel="stylesheet" href="resources/student.css" type="text/css"></link>
</head>
<body>
	<header>Create Your Account</header>
	<nav>개인정보를 입력하세요.</nav>
	<form class=form_one
		action="http://localhost:8080/ysy_mvcdb/StudentServlet?cmd=join"
		method="post">
		<ul>
			<li>계정 : <input type="text" name="id" autofocus required
				placeholder="공백없이 입력하세요"></li>
			<li>비밀번호 : <input type="password" name="passwd" autofocus
				required placeholder="공백없이 입력하세요"></li>
			<li>이름 : <input type="text" name="username" autofocus
				required placeholder="공백없이 입력하세요"></li>
			<li>학번 : <input type="text" name="snum" autofocus
				required placeholder="공백없이 입력하세요"></li>
			<li>학과 : <input type="text" name="depart" autofocus
				required placeholder="공백없이 입력하세요"></li>
			<li>모바일 : <input type="text" name="mobile" autofocus required
				placeholder="***.****.****"></li>
			<li>이메일 : <input type="text" name="email" autofocus required
				placeholder="****@****.***"></li><br>
			<li class=form_one><input type="submit" name="submit"
				value="보내기"></li>
		</ul>
	</form>
</body>
</html>
